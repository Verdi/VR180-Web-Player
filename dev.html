<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<title>VR180 Web Player (local test)</title>
	<!-- Local test page: loads the player from this folder, not the CDN. -->
	<link rel="stylesheet" href="vr180player/vr180-player.css">
	<style>
		body { font-family: system-ui, sans-serif; }
		main { max-width: 750px; margin: auto; }
	</style>
</head>
<body>
	<main>
		<h1>VR180 Web Player (local test)</h1>
		<p>Top player: the original embed. Skips 15 seconds.</p>
		<div id="vr-container">
			<video id="vr180" poster="poster.jpg" title="Top player (skips 15 s)" crossOrigin="anonymous" playsinline>
				<source src="sbs-video.mp4" type="video/mp4">
			</video>
		</div>
		<p>Bottom player: a second player with <code>data-skip-seconds="5"</code>. Skips 5 seconds.</p>
		<video data-vr180 data-skip-seconds="5" title="Bottom player (skips 5 s)" poster="poster.jpg" crossOrigin="anonymous" playsinline>
			<source src="sbs-video.mp4" type="video/mp4">
		</video>
	</main>
	<script type="module" src="vr180player/vr180-player.js"></script>
</body>
</html>
